<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Channels Ads Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff7ed}
  .app{display:flex;flex-direction:column;height:100%;padding:14px;gap:12px;box-sizing:border-box}
  .hero{background:linear-gradient(120deg,#ea580c,#f97316 60%,#c2410c);color:#fff;border-radius:20px;
        padding:20px 28px;display:flex;justify-content:space-between;align-items:center;
        box-shadow:0 10px 30px rgba(234,88,12,.25)}
  .pill{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
  h1{margin:8px 0 0;font-size:26px;font-weight:800;letter-spacing:-.5px}
  button{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
         border-radius:10px;padding:8px 16px;cursor:pointer}
  .frame{flex:1;min-height:0;background:#fff;border-radius:18px;overflow:hidden;
         box-shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);border:1px solid #fed7aa}
  iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div><span class="pill">Live Performance Reporting</span><h1>Channels Ads Performance Dashboard</h1></div>
    <button onclick="document.getElementById('r').requestFullscreen()">Fullscreen</button>
  </div>
  <div class="frame">
    <iframe id="r" allowfullscreen
      src="https://datastudio.google.com/embed/reporting/5619339b-55ab-4fff-a723-32c7aecfd815/page/p_b2kp23pk7d"
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>
</div>
</body>
</html>
